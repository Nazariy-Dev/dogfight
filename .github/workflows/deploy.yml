name: Deploy
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
      # Хостинг (Render) розгортає main сам через autoDeploy; deploy hook — лише якщо задано секрет
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then curl -fsS -X POST "$HOOK"; else echo "DEPLOY_HOOK_URL not set, Render autoDeploy handles main"; fi
